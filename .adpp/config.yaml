project:
  name: "绘梦"
  type: "Web应用"
  tech_stack: "vue3 + elementplus + python3.11.2"
  team_size: "1人"
  created_at: "2026-05-18"

runtime:
  model_management: "external"
  credentials_source: "user-environment"
  notes:
    - "模型选择由用户在 Claude Code 或外部插件中自行决定"
    - "密钥建议通过环境变量、oh-my-claudecode 或企业统一网关管理"

danger_operations:
  mode: "confirm"
  mobile_webhook: ""
  patterns:
    - "DROP TABLE"
    - "DELETE FROM"
    - "rm -rf"
    - "truncate"
    - "UPDATE.*WHERE.*1=1"

closeout:
  source_of_truth_docs:
    - ".adpp/changes/<feature>/prd.md"
    - ".adpp/changes/<feature>/design.md"
  derived_docs:
    - "README.md"
  trigger_matrix:
    - name: "api-or-backend-change"
      paths:
        - "src/api/**"
        - "backend/**"
      update:
        - ".adpp/changes/<feature>/prd.md"
        - ".adpp/changes/<feature>/design.md"
        - "README.md"
      verify:
        - "pytest"
    - name: "frontend-flow-change"
      paths:
        - "src/**"
        - "app/**"
      update:
        - ".adpp/changes/<feature>/design.md"
        - ".adpp/changes/<feature>/ux-notes.md"
        - "README.md"
      verify:
        - "npm run test"
  verification_layers:
    base:
      - "npm run lint"
      - "npm run test"
      - "pytest"
    docs_only:
      - "markdownlint README.md"
  evidence_dirs:
    - "coverage/"
    - "test-results/"
    - "output/"
  progress_note_template: |
    # Round Closeout
    ## Summary
    - Scope: {{ scope }}
    ## Docs Updated
    - {{ docs_updated }}
    ## Verification
    - {{ verification_summary }}
    ## Evidence
    - {{ evidence_paths }}
    ## Risks
    - {{ risks }}
