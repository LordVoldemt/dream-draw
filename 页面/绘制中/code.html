<style>
        .ink-progress {
            background: radial-gradient(circle, rgba(26,26,26,0.1) 0%, rgba(26,26,26,0) 70%);
            mask-image: radial-gradient(black, transparent);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-misty-white font-body-md text-on-surface selection:bg-cinnabar-red/20">
<!-- Shell Suppression: This is a task-focused generation screen, suppressing global TopNavBar and SideNavBar for focus. -->
<main class="min-h-screen flex flex-col items-center justify-center relative px-margin-mobile md:px-margin-desktop overflow-hidden">
<!-- Subtle Background Texture -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA3attKHY-QEijwXnNssJX-kjGP4d0xAoacnCq1PWZ8DAqfsdlF5hvBarmQSI528hNRVWQeOIHVtOHGPabTrxqaTZne9Bbvyw0P5gg0820MCIYUsRVoymKsTKYMHzerTXnRPSyqf8RmYCNGPrPF7sgh9sNbRVLu0tS7VY84Zk8bsh0fYxw0IW10wsRTtgBFq7NVB7VYVXZqDouwcoYrnUIs2DkTJESdkxHdSACV4IH8Pk-mTWh3_LFar0B4RBh2YPyEv8DHlm6B7bo');"></div>
<!-- Decorative Top-Right Seal Style Icon (Suppressed Nav but maintaining brand ID) -->
<div class="absolute top-10 right-10 flex flex-col items-center opacity-40">
<div class="w-12 h-12 border-2 border-cinnabar-red flex items-center justify-center p-1">
<span class="font-headline-md text-cinnabar-red text-[20px] leading-tight text-center">墨染<br/>梦境</span>
</div>
</div>
<!-- Main Content Area: Centered Progress -->
<div class="max-w-md w-full flex flex-col items-center gap-10 z-10">
<!-- Central Ink-Wash Progress Visual -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Outer Ring -->
<div class="absolute inset-0 border-[1px] border-ink-black/5 rounded-full"></div>
<!-- Pulsing Ink Effect Container -->
<div class="w-48 h-48 rounded-full bg-surface-container-lowest shadow-2xl shadow-ink-black/5 flex items-center justify-center overflow-hidden border border-ink-black/10">
<img class="w-full h-full object-cover opacity-80" data-alt="A mesmerizing, abstract ink-wash animation showing a bloom of black ink diffusing into pristine white water, creating elegant, organic smoky patterns. The style is minimalist Guofeng, with a misty white background and high-contrast ink textures. The lighting is soft and diffused, evoking a serene and poetic atmosphere typical of traditional Chinese landscape painting refined for a modern digital interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEwc15TAl0cw0XWVouR0ZQaiT_vhtkR1qWj6dAcbhQZRy1R8ynf2ZPaZL_giZIeoeX5X9Bsw41caJEBgaWRtEEiU8mQ4_UzeUCfTK8TCwcu9j7mz1P4qCoNXFGBfUE6-5qiZt5_1xEdkbWDC0C7nLfIMQIZvPx1oAO6tjTy6mE9z4qbyl3cH2WowuSY0s9BN_s1YtJGpdKtyhfcqeUhkadSvXnFMneozTQCldxA9jn22BZii2FtmkAYQNNEarM5DFmjV_qLoI53A4"/>
</div>
<!-- Silk Gold Decorative Ring Fragment -->
<div class="absolute -inset-2 border-2 border-silk-gold/20 rounded-full border-t-silk-gold"></div>
</div>
<!-- Progress Text Group -->
<div class="text-center flex flex-col gap-3">
<h1 class="font-headline-md text-headline-md text-ink-black tracking-widest">
                    AI 正在墨染梦境中...
                </h1>
<p class="font-body-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">schedule</span>
                    预计还需 15 秒
                </p>
</div>
<!-- Loading Bar (Subtle) -->
<div class="w-full bg-surface-container-highest/30 h-1 rounded-full overflow-hidden">
<div class="h-full bg-cinnabar-red w-3/4 rounded-full shadow-[0_0_12px_rgba(200,60,35,0.4)]"></div>
</div>
</div>
<!-- Bottom Tip Card (Glassmorphism) -->
<div class="absolute bottom-12 max-w-lg w-full px-4">
<div class="bg-surface-container-lowest/60 backdrop-blur-xl border border-white/40 p-6 rounded-xl shadow-sm flex items-start gap-4">
<div class="bg-jade-green/10 p-2 rounded-lg text-jade-green">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-md text-jade-green font-bold uppercase tracking-wider">创作贴士 (Creative Tip)</span>
<p class="font-body-md text-on-surface-variant">
                        试试在提示词中加入 “烟雨朦胧” 或 “朱砂点缀”，这能让生成的画面更具中国画的韵律美。
                    </p>
</div>
</div>
</div>
<!-- Aesthetic Floating Elements (Liu Bai support) -->
<div class="absolute top-1/4 left-10 w-24 h-24 bg-jade-green/5 blur-[60px] rounded-full"></div>
<div class="absolute bottom-1/4 right-20 w-40 h-40 bg-cinnabar-red/5 blur-[80px] rounded-full"></div>
</main>
<!-- Footer - Simplified for the Loading State -->
<footer class="fixed bottom-0 left-0 w-full p-6 text-center">
<p class="font-caption text-on-surface-variant/40">
            © 2024 墨染梦境 Ink Dream AI. All Rights Reserved.
        </p>
</footer>
