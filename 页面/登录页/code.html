<body class="bg-ink-black font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

<div class="fixed inset-0 z-0">

<div class="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/30"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Logo/Brand Identity -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-4xl md:text-5xl text-cinnabar-red font-bold tracking-tight mb-2 drop-shadow-sm">墨染梦境</h1>
<p class="font-label-md text-label-md text-ink-black/70 uppercase tracking-[0.3em]">Ink Dream Universe</p>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-panel ink-shadow rounded-2xl p-8 md:p-10">
<div class="mb-10">
<h2 class="font-headline-md text-headline-md text-ink-black mb-1">登录 / 注册</h2>
<p class="font-caption text-caption text-on-surface-variant">开启您的东方美学梦境之旅</p>
</div>
<!-- Tabs -->

<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Account Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="phone">
<span class="material-symbols-outlined text-[18px]">smartphone</span>
                        手机号
                    </label>
<input class="w-full bg-white/40 border border-white/60 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cinnabar-red/20 focus:border-cinnabar-red transition-all font-body-md text-body-md placeholder:text-on-surface-variant/40" id="phone" name="phone" placeholder="请输入您的手机号" type="tel">
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2" for="vcode">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
                        验证码
                    </label>
<div class="relative flex gap-2">
<input class="flex-1 bg-white/40 border border-white/60 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-cinnabar-red/20 focus:border-cinnabar-red transition-all font-body-md text-body-md placeholder:text-on-surface-variant/40" id="vcode" name="vcode" placeholder="请输入验证码" type="text">
<button type="button" class="whitespace-nowrap px-4 py-2 text-cinnabar-red font-label-md border border-cinnabar-red/30 rounded-lg hover:bg-cinnabar-red/5 transition-colors">获取验证码</button>
</div>
</div>
<!-- Error Message Placeholder (Hidden by default or conditionally shown) -->
<!-- 
                <div class="flex items-center gap-2 text-error px-3 py-2 rounded-lg bg-error-container/20 border border-error/20">
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">error</span>
                    <span class="font-caption text-caption">登录凭据无效，请重试。</span>
                </div>
                -->
<!-- Submit Button (The Seal CTA) -->
<div class="pt-2">
<button class="seal-cta w-full bg-cinnabar-red text-on-primary py-4 rounded-xl font-title-lg text-title-lg shadow-lg hover:bg-primary transition-all flex items-center justify-center gap-3 group" type="submit">
                        确认进入
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
