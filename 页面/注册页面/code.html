<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24

.rice-paper {

    }
.glass-panel {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.3)
    }
.seal-button {
    position: relative;
    overflow: hidden
    }
.seal-button::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url(https://www.transparenttextures.com/patterns/black-paper.png);
    opacity: 0.1;
    pointer-events: none
    }
@keyframes ink-flow {
    0% {
        transform: scale(0.95);
        opacity: 0;
        } 100% {
        transform: scale(1);
        opacity: 1;
        }
    }
.animate-ink {
    animation: ink-flow 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards
    }
.input-guofeng {
    border: none;
    border-bottom: 1px solid rgba(26, 26, 26, 0.2);
    background: transparent;
    border-radius: 0;
    transition: all 0.3s ease
    }
.input-guofeng:focus {
    outline: none;
    box-shadow: none;
    border-bottom-color: #4F796A
    }
.reward-badge {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
    border: 1px solid rgba(212, 175, 55, 0.3)
    }</style>

<body class="font-body-md text-on-surface bg-misty-white h-screen overflow-hidden flex items-center justify-center">
<!-- Background Hero Image -->
<div class="fixed inset-0 z-0">
<img alt="Ink Dream Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ug1SjTeasu77C3jPQznRO17t4fze_F-y8IU-elhk-S9O2ZG5GsxYJPZyG8QCvRYyD8Nbq-nrn8w828wRcbsfo5uePlEDymFwiM5jscOQb8FcFqW28co7aNTnW1nrwq8F3qh4KQYR4gw5ztLWWZN5t-9I3HOkAQCLW1H_Oek9x0U1aT-LCyTAcLPAJEpDIMgTyw1JizV1d9WXdRBLQOXSLehfP2YKxLCjQ9J7-YEkB0CmX-z5ZbMxTrcAA"/>
<div class="absolute inset-0 bg-ink-black/5 pointer-events-none"></div>
</div>
<!-- Main Registration Shell -->
<div class="relative z-10 w-full max-w-[480px] mx-4 md:mx-0 animate-ink">
<div class="glass-panel rice-paper rounded-2xl p-10 shadow-2xl overflow-hidden relative">
<!-- Decorative Seal Corners -->
<div class="absolute top-0 right-0 w-24 h-24 border-t-2 border-r-2 border-silk-gold/30 rounded-tr-2xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-24 h-24 border-b-2 border-l-2 border-silk-gold/30 rounded-bl-2xl pointer-events-none"></div>
<!-- Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-ink-black mb-2 tracking-tight">欢迎创建你的</h1>
<h1 class="font-headline-lg text-headline-lg text-cinnabar-red mb-4 tracking-wider">专属国风身份</h1>
<div class="w-12 h-[2px] bg-silk-gold mx-auto mb-6"></div>
<!-- Reward Badge -->
<div class="reward-badge px-4 py-2 rounded-lg inline-flex items-center gap-2">
<span class="material-symbols-outlined text-silk-gold" style="font-variation-settings: 'FILL' 1;">card_giftcard</span>
<span class="font-label-md text-label-md text-on-surface-variant">新人礼遇：注册即送 <span class="text-cinnabar-red font-bold">10</span> 次免费生成机会</span>
</div>
</div>
<!-- Registration Form -->
<form class="space-y-8" id="registerForm" onsubmit="return handleRegister(event)">
<!-- Phone Input -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">手机号码</label>
<div class="relative group">
<span class="absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant/40 material-symbols-outlined">smartphone</span>
<input class="input-guofeng w-full py-3 pl-8 font-body-md text-on-surface placeholder:text-on-surface-variant/30" id="phoneInput" pattern="^1[3-9]\d{9}$" placeholder="请输入您的手机号" required="" type="tel"/>
</div>
<p class="text-error text-caption font-caption hidden mt-1" id="phoneError">手机号格式错误</p>
</div>
<!-- Verification Code Input -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">验证码</label>
<div class="flex gap-4">
<div class="relative grow group">
<span class="absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant/40 material-symbols-outlined">verified_user</span>
<input class="input-guofeng w-full py-3 pl-8 font-body-md text-on-surface placeholder:text-on-surface-variant/30" id="codeInput" maxlength="6" placeholder="请输入验证码" required="" type="text"/>
</div>
<button class="whitespace-nowrap px-6 py-2 border border-jade-green/40 text-jade-green font-label-md text-label-md rounded-lg hover:bg-jade-green/5 transition-all active:scale-95" id="sendCodeBtn" onclick="sendVerificationCode()" type="button">
                            获取验证码
                        </button>
</div>
<p class="text-jade-green text-caption font-caption hidden mt-1 flex items-center gap-1" id="codeSuccess">
<span class="material-symbols-outlined text-[14px]">check_circle</span> 验证码已发送
                    </p>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3">
<input class="mt-1 w-4 h-4 rounded border-outline text-cinnabar-red focus:ring-cinnabar-red transition-all cursor-pointer" id="termsCheck" required="" type="checkbox"/>
<label class="font-caption text-caption text-on-surface-variant leading-relaxed" for="termsCheck">
                        我已阅读并同意 <a class="text-jade-green hover:underline" href="#">《使用协议》</a> 与 <a class="text-jade-green hover:underline" href="#">《隐私政策》</a>，开启我的梦境之旅。
                    </label>
</div>
<!-- CTA Button -->
<button class="seal-button w-full bg-cinnabar-red text-white py-4 rounded-lg font-title-lg text-title-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    立即注册并领取奖励
                    <span class="material-symbols-outlined">auto_awesome</span>
</button>
</form>
<!-- Navigation Footer -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    已有账号？ <a class="text-cinnabar-red font-semibold hover:underline" href="#">立即登录</a>
</p>
</div>
</div>
<!-- Decorative Elements -->
<div class="absolute -bottom-16 -right-16 w-32 h-32 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-cinnabar-red" style="font-variation-settings: 'FILL' 1;">ink_highlighter</span>
</div>
</div>
<!-- Notification Toast -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 bg-ink-black/80 backdrop-blur-xl text-misty-white px-6 py-3 rounded-full font-label-md text-label-md shadow-2xl transition-all opacity-0 translate-y-[-20px] pointer-events-none z-50 flex items-center gap-3" id="toast">
<span class="material-symbols-outlined text-jade-green" id="toastIcon">info</span>
<span id="toastMsg">提示信息</span>
</div>
<script>
        let countdown = 60;
        let timer = null;

        function showToast(msg, icon = 'info', color = 'text-jade-green') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.innerText = msg;
            toastIcon.innerText = icon;
            toastIcon.className = `material-symbols-outlined ${color}`;
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        function sendVerificationCode() {
            const phoneInput = document.getElementById('phoneInput');
            const phoneError = document.getElementById('phoneError');
            const codeSuccess = document.getElementById('codeSuccess');
            const btn = document.getElementById('sendCodeBtn');

            // Simple validation check
            if (!/^1[3-9]\d{9}$/.test(phoneInput.value)) {
                phoneError.classList.remove('hidden');
                phoneInput.classList.add('border-error');
                return;
            } else {
                phoneError.classList.add('hidden');
                phoneInput.classList.remove('border-error');
            }

            // Start Countdown
            if (timer) return;
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            codeSuccess.classList.remove('hidden');
            showToast('验证码已发送至您的手机', 'sms', 'text-jade-green');

            timer = setInterval(() => {
                countdown--;
                btn.innerText = `${countdown}s 后重试`;
                if (countdown <= 0) {
                    clearInterval(timer);
                    timer = null;
                    countdown = 60;
                    btn.disabled = false;
                    btn.innerText = '重新获取';
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    codeSuccess.classList.add('hidden');
                }
            }, 1000);
        }

        function handleRegister(event) {
            event.preventDefault();
            const phoneInput = document.getElementById('phoneInput');
            const codeInput = document.getElementById('codeInput');
            const termsCheck = document.getElementById('termsCheck');

            if (!phoneInput.value || !codeInput.value || !termsCheck.checked) {
                showToast('请完整填写信息', 'warning', 'text-silk-gold');
                return false;
            }

            // Mock Success State
            const btn = event.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 开启中...';
            btn.disabled = true;

            setTimeout(() => {
                showToast('注册成功！欢迎来到墨染梦境', 'verified', 'text-jade-green');
                setTimeout(() => {
                    location.reload(); // Reset for demo purposes
                }, 1500);
            }, 2000);

            return false;
        }

        // Live Validation Clear
        document.getElementById('phoneInput').addEventListener('input', function() {
            document.getElementById('phoneError').classList.add('hidden');
            this.classList.remove('border-error');
        });
    </script>
</body></html>
